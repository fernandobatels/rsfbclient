# Based on:
#   - https://github.com/actions-rs/example/blob/master/.github/workflows/quickstart.yml
#
# Using:
#   - https://github.com/actions-rs/toolchain   -> https://github.com/marketplace/actions/rust-toolchain
#   - https://github.com/actions-rs/cargo       -> https://github.com/marketplace/actions/rust-cargo
#   - https://github.com/taiki-e/install-action -> https://github.com/marketplace/actions/install-development-tools
#
# TODO:
#   - Run tests in arm little-endian architecture (travis-ci?)
#   - Test cross compilation to many arch (E.g ripgrep)
#   - cargo test fails with linking on macos

on:
  push:
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

name: testing_changes

jobs:
  run-guard:
    # other jobs depend on this one using 'needs: run-guard' to avoid running when it is skipped.
    # it succeeds if any of the following conditions are met:
    #   - it is not a pr-labeling event AND the pr is not labeled 'prevent-ci' AND it is not a draft pr
    #   - it is not a pr-labeling event AND the pr is labeled 'force-ci'
    #   - it is a pr-labeling event AND the label being added is 'force-ci'
    #
    # on success it dumps the action's 'github' context
    runs-on: ubuntu-latest
    name: "run-guard"
    if: |
      (
           (github.event.action != 'labeled')
        && !contains( github.event.pull_request.labels.*.name, 'prevent-ci')
        && !github.event.pull_request.draft
      )
      || ( (github.event.action != 'labeled') && contains( github.event.pull_request.labels.*.name, 'force-ci' ) )
      || (github.event.label.name == 'force-ci')
    steps:
      - name: continue
        run: echo not skipping CI. continuing now...

  linting:
    name: linting
    runs-on: ubuntu-latest
    needs: run-guard
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: default
          toolchain: stable
          default: true
          override: true
          components: rustfmt, clippy

      - name: Run cargo build
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --verbose

      - name: Run cargo clippy
        uses: actions-rs/clippy-check@v1
        continue-on-error: true # show all errors
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  testing:
    name: testing
    needs: linting
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        firebird: [v3, v2, v4, v5]
        build: [linking, dynamic_loading, pure_rust]
        exclude:
          - os: "windows-latest"
            firebird: v2
          - os: "windows-latest"
            firebird: v3
          - os: "windows-latest"
            firebird: v4
          - os: "macos-latest"
            firebird: v2
          - os: "macos-latest"
            firebird: v3
          - os: "macos-latest"
            firebird: v4
          - os: "ubuntu-latest"
            firebird: v2
            build: pure_rust
          - os: "ubuntu-latest"
            firebird: v5
          - os: "macos-latest"
            build: dynamic_loading
        include:
          - os: "ubuntu-latest"
            plataform: linux
          - os: "windows-latest"
            plataform: windows
          - os: "macos-latest"
            plataform: macos
          - firebird: v2
            image: "2.5-ss"
          - firebird: v3
            image: "3.0"
          - firebird: v4
            image: "4.0"
          - firebird: v5
            image: "5.0"
          - build: linking
            features: linking
            features_diesel: linking
          - build: dynamic_loading
            features: dynamic_loading
            features_diesel: dynamic_loading
          - build: pure_rust
            features: pure_rust
            features_diesel: pure_rust
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Setup FirebirdSQL ${{ matrix.firebird }} with image  ${{ matrix.image }} on docker
        if: matrix.plataform == 'linux'
        uses: juarezr/firebirdsql-github-action@v1.0.0
        with:
          version: "${{ matrix.image }}"
          firebird_database: "test.fdb"
          firebird_user: "test_user"
          firebird_password: "test_password"
          isc_password: "masterkey"

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup FirebirdSQL ${{ matrix.firebird }} on Windows
        if: matrix.plataform == 'windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./.github/ci-scripts/download_firebird_windows.ps1

      - name: Setup FirebirdSQL ${{ matrix.firebird }} on MacOSX
        if: matrix.plataform == 'macos'
        shell: bash
        run: |
          wget https://github.com/FirebirdSQL/firebird/releases/download/v5.0.4/Firebird-5.0.4.1812-0-macos-arm64.pkg -O /tmp/firebird.pkg
          sudo installer -verbose -pkg /tmp/firebird.pkg -target /
          sudo mkdir -p /usr/local/lib
          sudo ln -s /Library/Frameworks/Firebird.framework/Versions/A/Libraries/libfbclient.dylib /usr/local/lib/libfbclient.dylib
          echo "DYLD_LIBRARY_PATH=/usr/local/lib:/Library/Frameworks/Firebird.framework/Versions/A/Libraries:/Library/Frameworks/Firebird.framework/Versions/A/Resources/lib" >> "$GITHUB_ENV"

      - name: Locate and expose fbclient lib and dll (Windows)
        if: matrix.plataform == 'windows'
        shell: pwsh
        run: |
          # Search common install locations for fbclient .lib/.dll (recursively)
          $common = @(
            "C:\Program Files\Firebird",
            "C:\Firebird",
            "$env:WINDIR\System32",
            "$env:ProgramFiles(x86)\Firebird"
          )

          $foundLib = $null
          foreach ($folder in $common) {
            if (-not (Test-Path $folder)) { continue }
            $foundLib = Get-ChildItem -Path $folder -Include "fbclient.lib","fbclient_ms.lib" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundLib) { break }
          }

          $foundDll = $null
          foreach ($folder in $common) {
            if (-not (Test-Path $folder)) { continue }
            $foundDll = Get-ChildItem -Path $folder -Include "fbclient.dll" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundDll) { break }
          }

          if (-not $foundLib) {
            Write-Error "fbclient .lib not found. Ensure Firebird is installed on the runner or the installer script places fbclient.lib in a known location."
            exit 1
          }

          $libDir = Split-Path $foundLib.FullName -Parent
          Write-Host "Found fbclient lib at: $($foundLib.FullName)"
          echo "FBCLIENT_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Prepend the found lib folder to LIB so MSVC linker finds the .lib import
          $newLib = if ($env:LIB) { "$libDir;$env:LIB" } else { "$libDir" }
          echo "LIB=$newLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Added $libDir to LIB"

          if ($foundDll) {
            $dllDir = Split-Path $foundDll.FullName -Parent
            Write-Host "Found fbclient dll at: $($foundDll.FullName)"
            # Prepend dll dir to PATH for runtime resolution during tests
            $newPath = if ($env:PATH) { "$dllDir;$env:PATH" } else { "$dllDir" }
            echo "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Added $dllDir to PATH"

            # Optional: copy DLL to workspace to help runtime resolution if needed
            Copy-Item -Path $foundDll.FullName -Destination $PWD -Force
          }

      - name: Create a alias to test.fdb on fb v2
        if: matrix.firebird == 'v2'
        run: |
          docker exec firebirdsql /bin/bash '/usr/local/firebird/bin/createAliasDB.sh' 'test.fdb' '/firebird/data/test.fdb'
          docker container restart firebirdsql
          echo '# Restarted container firebirdsql'

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: default
          toolchain: stable
          default: true

      - name: Install cli and development library on Linux
        if: matrix.plataform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends firebird3.0-utils firebird-dev

      - name: Create database test.fdb in fb ${{ matrix.firebird }} on Windows
        if: matrix.plataform == 'windows'
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./.github/ci-scripts/create_sysdba_user_windows.ps1
          echo "CREATE DATABASE 'localhost:test.fdb';" | & "C:\Program Files\Firebird\isql.exe" -bail -quiet -z -user SYSDBA -password masterkey

      - name: Create database test.fdb in fb ${{ matrix.firebird }} on MacOSX
        if: matrix.plataform == 'macos'
        run: |
          echo "CREATE DATABASE 'localhost:test.fdb';" | /Library/Frameworks/Firebird.framework/Resources/bin/isql -bail -quiet -z -user SYSDBA -password masterkey

      - name: Testing Connection and Query on Linux
        if: matrix.firebird != 'v4' && matrix.plataform == 'linux'
        run: |
          SQL1='select RDB$CHARACTER_SET_NAME as charset_sysdba from rdb$database;'
          echo $SQL1 | isql-fb -bail -quiet -z -user SYSDBA -password masterkey 'localhost:/firebird/data/test.fdb'

      - name: Testing Connection for User test_user on fb v3
        if: matrix.firebird == 'v3' && matrix.plataform == 'linux'
        run: |
          SQL2='select RDB$CHARACTER_SET_NAME as charset_user from rdb$database;'
          echo $SQL2 | isql-fb -bail -quiet -z -user test_user -password test_password 'localhost:test.fdb'

      - name: Run cargo build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: -v --no-default-features --features '${{ matrix.features }}'
          # Searching for fbclient.lib in rsfbclient-native/build.rs

      - name: Run cargo test on rsfbclient
        uses: actions-rs/cargo@v1
        if: matrix.plataform != 'macos' || matrix.build != 'linking'
        with:
          command: test
          args: --no-default-features --features '${{ matrix.features }}' -- --test-threads 1

      - name: Run cargo test on rsfbclient-rust
        uses: actions-rs/cargo@v1
        if: matrix.plataform != 'macos' || matrix.build != 'linking'
        with:
          command: test
          args: -p rsfbclient-rust

      - name: Run cargo test on rsfbclient-diesel
        uses: actions-rs/cargo@v1
        if: matrix.plataform != 'macos' || matrix.build != 'linking'
        with:
          command: test
          args: --manifest-path rsfbclient-diesel/Cargo.toml --no-default-features --features '${{ matrix.features_diesel }}' -- --test-threads 1

      - name: Install cargo-llvm-cov on rsfbclient
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Code Coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --no-default-features --features '${{ matrix.features }}' -- --test-threads 1

      - name: Coveralls Parallel on rsfbclient
        uses: coverallsapp/github-action@master
        #if: matrix.plataform == 'linux'
        env:
          COVERALLS_FLAG_NAME: run-${{ matrix.firebird }}-${{ matrix.build }}-rsfbclient
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./lcov.info"
          parallel: true
          # flag-name: run-${{ matrix.firebird }}-${{ matrix.build }}

      - name: Generate Code Coverage on rsfbclient-rust
        run: cargo llvm-cov --lcov --output-path lcov.info -p rsfbclient-rust

      - name: Coveralls Parallel on rsfbclient-rust
        uses: coverallsapp/github-action@master
        #if: matrix.plataform == 'linux'
        env:
          COVERALLS_FLAG_NAME: run-${{ matrix.firebird }}-${{ matrix.build }}-rsfbclient-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./lcov.info"
          parallel: true
          # flag-name: run-${{ matrix.firebird }}-${{ matrix.build }}

      - name: Generate Code Coverage on rsfbclient-diesel
        run: cargo llvm-cov --lcov --output-path lcov.info --manifest-path rsfbclient-diesel/Cargo.toml --no-default-features --features '${{ matrix.features_diesel }}' -- --test-threads 1

      - name: Coveralls Parallel on rsfbclient-diesel
        uses: coverallsapp/github-action@master
        #if: matrix.plataform == 'linux'
        env:
          COVERALLS_FLAG_NAME: run-${{ matrix.firebird }}-${{ matrix.build }}-rsfbclient-diesel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./lcov.info"
          parallel: true
          # flag-name: run-${{ matrix.firebird }}-${{ matrix.build }}

      - name: Cleanup docker
        if: matrix.plataform == 'linux'
        run: |
          docker rm --volumes --force firebirdsql

      - name: Cleanup coverage on unix
        if: matrix.plataform != 'windows'
        run: rm -f ./lcov.info

      - name: Cleanup coverage on Window
        if: matrix.plataform == 'windows'
        run: rm -Force .\lcov.info

  coverage:
    name: coverage
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  embedded:
    name: embedded
    needs: linting
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        build: [linking, dynamic_loading]
        include:
          - build: linking
            features: linking embedded_tests
          - build: dynamic_loading
            features: dynamic_loading embedded_tests
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: default
          toolchain: stable
          default: true

      - name: Setup FirebirdSQL 4.0 for embedded tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends firebird4.0-utils firebird-dev firebird4.0-server-core

      - name: Create database for embedded tests
        run: |
          echo 'create database "/tmp/embedded_tests.fdb";' | isql-fb -bail -quiet -user SYSDBA

      - name: Run cargo embedded tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --no-default-features --features '${{ matrix.features }}' -- --test-threads 1

  security:
    name: security
    if: github.ref != 'refs/heads/master'
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Run security audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
# end of file
